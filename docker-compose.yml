services:
  db:
    image: postgres:16
    container_name: ${DB_HOST}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:${DB_PORT}" # Quitar en produccion
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - redroosters_audio:/app/uploads/audio

  backend:
    build:
      context: ./backend
    container_name: backend
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACK_PORT: ${BACK_PORT}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AUDIO_DIR: /app/uploads/audio
      TZ: Europe/Madrid
      JAVA_TOOL_OPTIONS: -Duser.timezone=Europe/Madrid # Para detectar la hora correcta
    ports:
      - "${BACK_PORT}:${BACK_PORT}"
    volumes:
      - redroosters_audio:/app/uploads/audio
      - redroosters_portadas:/app/uploads/portadas

    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      #target: dev # Desarrollo
      #target: build # Produccion
    container_name: frontend
    #ports:
    #  - "${FRONT_PORT}:${FRONT_PORT}"
    #expose:
    #  - "80" # Nginx
    environment:
      PUBLIC_API_URL: "${PUBLIC_API_URL}"
      CHOKIDAR_USEPOLLING: "true" # Desarrollo, comprueba periodicamente archivos
      CHOKIDAR_INTERVAL: "300" # Desarrolo, tiempo envio cada de peticion
      PUBLIC_BACKEND_URL: "${PUBLIC_BACKEND_URL}"
      BACKEND_INTERNAL_URL: "${BACKEND_INTERNAL_URL}"
    #volumes:
    #  - ./frontend:/app
    #  - /app/node_modules # Evita sobrescribir las dependencias del contenedor
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Config de Nginx
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

      # Certificados de Let's Encrypt Produccion
      - /etc/letsencrypt:/etc/letsencrypt:ro

      # Solo para local, (en local comentar la linea de arriba y en produccion comentar esta linea)
      #- ./certs:/etc/letsencrypt:ro


      # Volúmenes para servir audios y portadas
      - ./certbot/www:/var/www/certbot
      - redroosters_audio:/app/uploads/audio:ro
      - redroosters_portadas:/app/uploads/portadas:ro

    depends_on:
      - frontend
      - backend

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      # Mantiene certbot en bucle para renovar automáticamente cada 12h
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redroosters_audio:
  redroosters_portadas:


